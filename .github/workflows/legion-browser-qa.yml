name: LEGION owned synthetic Chromium browser QA exam

on:
  pull_request:
    paths:
      - 'legion/browser_qa.py'
      - 'legion/browser_qa_exam.py'
      - 'legion/exams/browser_qa_12_v1.json'
      - 'browser_tests/**'
      - '.github/workflows/legion-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'legion/browser_qa.py'
      - 'legion/browser_qa_exam.py'
      - 'legion/exams/browser_qa_12_v1.json'
      - 'browser_tests/**'
      - '.github/workflows/legion-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-exam:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'browser-requirements.txt'
      - name: Install pinned browser automation (no application secrets)
        run: |
          python -m pip install -r browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser-executable exam on owned synthetic pages only
        run: |
          python -m unittest discover -s browser_tests -p 'test_*.py' -v
          python -m legion.browser_qa_exam
