name: LEGION Ed25519 signed synthetic mission replay and stop gate

on:
  pull_request:
    paths:
      - 'legion/signed_demo_dispatch.py'
      - 'signed_tests/**'
      - 'signed-requirements.txt'
      - '.github/workflows/legion-signed-dispatch.yml'
      - 'docs/LEGION_SIGNED_DISPATCH_SPRINT_013.md'
  push:
    branches: [main]
    paths:
      - 'legion/signed_demo_dispatch.py'
      - 'signed_tests/**'
      - 'signed-requirements.txt'
      - '.github/workflows/legion-signed-dispatch.yml'
      - 'docs/LEGION_SIGNED_DISPATCH_SPRINT_013.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-demo-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'signed-requirements.txt'
      - name: Install pinned public crypto dependency
        run: python -m pip install --requirement signed-requirements.txt
      - name: Compile signed dispatch and tests
        run: python -m compileall -q legion/signed_demo_dispatch.py signed_tests
      - name: Run real Ed25519 verification and replay/kill negative controls
        run: python -m unittest discover -s signed_tests -p 'test_*.py' -v
