name: LEGION offline synthetic skills and safety controls

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-legion:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Python
        run: python3 --version
      - name: Compile all source and tests
        run: python3 -m compileall -q legion tests
      - name: Run deterministic lifecycle, simulation, license and kill-switch tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Execute synthetic LEGION career-path example
        run: python3 -m legion.cli demo
